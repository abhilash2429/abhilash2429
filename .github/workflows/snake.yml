name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C15F3C&color_dots=#ebedf0,#F6D5C4,#EDA98A,#D97757,#A8492A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F0B49A&color_dots=#161b22,#5A3426,#8E4A30,#C96442,#F0A07E

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
